name: Security checks

on:
  pull_request:
  push:
    branches:
      - main
      - build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies without running build scripts
        run: |
          corepack enable
          yarn install --immutable --mode=skip-build

      - name: Fail on high or critical dependency advisories
        run: node .github/scripts/audit.mjs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24.x'

      - name: Install Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan changes or full history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            gitleaks git --redact --verbose --log-opts=--all
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            gitleaks git --redact --verbose --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            gitleaks git --redact --verbose --log-opts="$PUSH_AFTER_SHA"
          else
            gitleaks git --redact --verbose --log-opts="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
          fi
