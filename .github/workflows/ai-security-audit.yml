name: AI security audit

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  audit:
    name: AI security audit
    # Title/description edits do not change the code; only a base-branch change does.
    if: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
    # Job-level so a skipped edit event cannot cancel an in-progress audit.
    concurrency:
      group: ai-security-audit-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ${{ vars.AI_SECURITY_RUNNER || 'buildinator-group' }}
    # Large PRs are audited as several sequential model requests, each of
    # which may take up to AI_SECURITY_REQUEST_TIMEOUT (default 15 minutes).
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # Never check out or execute the PR head under pull_request_target.
      # github.sha is the base branch tip when the event fired; the PR's
      # base.sha can be stale and would run outdated audit tooling.
      - name: Check out trusted audit tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          clean: true

      - name: Mark PR head audit pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I .github/scripts/ai_security_audit.py pending

      - name: Fetch PR objects without checking them out
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/ai-audit-head"
          test "$(git rev-parse refs/remotes/origin/ai-audit-head)" = "$HEAD_SHA"

      - name: Audit changed code with local LiteLLM
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL }}
          LITELLM_SEED: ${{ vars.LITELLM_SEED }}
          AI_SECURITY_CONTEXT_BYTES: ${{ vars.AI_SECURITY_CONTEXT_BYTES || '60000' }}
          AI_SECURITY_BATCH_BYTES: ${{ vars.AI_SECURITY_BATCH_BYTES }}
          AI_SECURITY_MAX_BATCHES: ${{ vars.AI_SECURITY_MAX_BATCHES }}
          AI_SECURITY_MAX_TOKENS: ${{ vars.AI_SECURITY_MAX_TOKENS }}
          AI_SECURITY_REQUEST_TIMEOUT: ${{ vars.AI_SECURITY_REQUEST_TIMEOUT }}
          AI_SECURITY_MIN_BLOCKING_CONFIDENCE: ${{ vars.AI_SECURITY_MIN_BLOCKING_CONFIDENCE }}
          AI_SECURITY_MAX_VERIFICATIONS: ${{ vars.AI_SECURITY_MAX_VERIFICATIONS }}
          AI_SECURITY_VERIFY_CONTEXT_BYTES: ${{ vars.AI_SECURITY_VERIFY_CONTEXT_BYTES }}
          AI_SECURITY_FAIL_ON: ${{ vars.AI_SECURITY_FAIL_ON || 'high' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # -I also prevents Python imports from the workspace/PYTHONPATH.
        run: python3 -I .github/scripts/ai_security_audit.py audit

      - name: Publish job summary and PR comment
        if: ${{ always() && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I .github/scripts/ai_security_audit.py report

      - name: Upload audit reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-security-audit-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-security-audit-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14