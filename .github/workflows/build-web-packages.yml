name: Build Web Packages
run-name: '45flow-web:${{ inputs.request_id }}'
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact pushed desktop release commit
        required: true
        type: string
      expected_version:
        description: App version used by the desktop orchestrator
        required: true
        type: string
      request_id:
        description: Unique orchestrator dispatch identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  prebuild:
    runs-on: buildinator-5
    outputs:
      manifest: ${{ steps.prebuild.outputs.manifest }}
      matrix: ${{ steps.prebuild.outputs.matrix }}
      uuid: ${{ steps.prebuild.outputs.uuid }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          submodules: recursive
      - name: Verify release source and sync package version
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: sh scripts/web/ci-prepare.sh "$SOURCE_SHA" "$EXPECTED_VERSION"
      - id: prebuild
        uses: 45drives/actions/prebuild-flow@main
        with:
          directory: ${{ github.workspace }}
      - name: Snapshot workspace for this run
        run: |
          RUN_DIR="${{ runner.workspace }}/run-${{ steps.prebuild.outputs.uuid }}"
          mkdir -p "$RUN_DIR"
          rsync -a --delete --exclude .git --exclude node_modules --exclude build "${{ github.workspace }}/" "$RUN_DIR/"

  build:
    needs: prebuild
    runs-on: buildinator-group
    strategy:
      matrix:
        build: ${{ fromJSON(needs.prebuild.outputs.matrix).include }}
    steps:
      - uses: 45drives/actions/build-package@main
        with:
          manifest: ${{ needs.prebuild.outputs.manifest }}
          build: ${{ toJSON(matrix.build) }}
          uuid: ${{ needs.prebuild.outputs.uuid }}

  sign:
    needs: [prebuild, build]
    runs-on: buildinator-5
    steps:
      - name: Verify all distro builds
        run: |
          for OS in ubuntu-focal ubuntu-jammy debian-bookworm debian-trixie rocky-el8 rocky-el9; do
            test -f "/mnt/ci_artifacts/${{ needs.prebuild.outputs.uuid }}/output/$OS/build_info.json"
          done
      - uses: 45drives/actions/ansible-playbook@main
        with:
          playbook: /root/git/auto-packaging/actions/ansible/sign.yml
          directory: ${{ runner.workspace }}/run-${{ needs.prebuild.outputs.uuid }}/packaging
          group_vars_directory: ${{ runner.workspace }}/run-${{ needs.prebuild.outputs.uuid }}/packaging/group_vars/
          inventory: |
            [ci]
            localhost
          become: true
          host_key_checking: true
          extra_vars: sign_key_name=prod uuid=${{ needs.prebuild.outputs.uuid }}
      # update-repo builds these exact paths from manifest.json and reports success even
      # when a file is missing, so check the names it will publish, not just a count.
      - name: Verify signed web packages before repository publication
        env:
          SIGNED_DIR: /mnt/ci_artifacts/${{ needs.prebuild.outputs.uuid }}/sign/prod
          MANIFEST: ${{ runner.workspace }}/run-${{ needs.prebuild.outputs.uuid }}/manifest.json
        run: |
          field() { sed -n -E "0,/\"$1\"[[:space:]]*:/s/^[[:space:]]*\"$1\"[[:space:]]*:[[:space:]]*\"([^\"]+)\".*/\1/p" "$MANIFEST"; }
          VERSION="$(field version)"
          BUILD="$(field build_number)"
          [ -n "$VERSION" ] && [ -n "$BUILD" ] || { echo "::error::cannot read version/build_number from $MANIFEST"; exit 1; }
          missing=0
          for OS in ubuntu-focal ubuntu-jammy debian-bookworm debian-trixie; do
            f="$SIGNED_DIR/$OS/debs/45flow-web_${VERSION}-${BUILD}${OS##*-}_all.deb"
            [ -f "$f" ] || { echo "::error::missing $f"; ls -la "$SIGNED_DIR/$OS/debs" || true; missing=1; }
          done
          for EL in el8 el9; do
            f="$SIGNED_DIR/rocky-$EL/rpms/noarch/45flow-web-${VERSION}-${BUILD}.$EL.noarch.rpm"
            [ -f "$f" ] || { echo "::error::missing $f"; ls -la "$SIGNED_DIR/rocky-$EL/rpms/noarch" || true; missing=1; }
          done
          exit $missing

  update_repositories:
    needs: [prebuild, build, sign]
    runs-on: buildinator-5
    steps:
      - uses: 45drives/actions/update-repo@main
        with:
          directory: ${{ runner.workspace }}/run-${{ needs.prebuild.outputs.uuid }}

  sync_repositories:
    needs: [prebuild, build, sign, update_repositories]
    runs-on: buildinator-5
    steps:
      - uses: 45drives/actions/sync-repo@main
        with:
          directory: ${{ runner.workspace }}/run-${{ needs.prebuild.outputs.uuid }}
