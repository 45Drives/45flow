<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Servers are user-chosen hosts reached over http(s)/ws(s), so connect/media sources are scheme-limited rather than host-limited. -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; img-src 'self' data: blob: http: https:; media-src 'self' blob: http: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; child-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta charset="utf-8">
    <title>45Flow</title>
  </head>
  <body class="h-full">
    <div id="app" class="h-full"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
